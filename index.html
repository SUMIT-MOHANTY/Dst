<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nitesh Saw - Profile</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>
    <div class="container">
        <header class="profile-header">
            <div class="avatar-container">
                <div class="avatar" id="profile-avatar"></div>
            </div>
            <div class="profile-info">
                <h1 class="name" id="profile-name"></h1>
                <p class="title" id="profile-title"></p>
                <div class="social-links" id="social-links"></div>
            </div>
        </header>
        <main>
            <section class="card bio-section">
                <h2 class="card-title">About Me</h2>
                <p class="bio-text" id="profile-bio"></p>
            </section>
            <section class="card background-section">
                <h2 class="card-title">Background</h2>
                <div class="timeline" id="background-timeline"></div>
            </section>
            <section class="card skills-section">
                <h2 class="card-title">Skills & Expertise</h2>
                <div class="skills-container" id="skills-container"></div>
            </section>
            <section class="card contact-section">
                <h2 class="card-title">Contact Information</h2>
                <div class="contact-info" id="contact-info"></div>
            </section>
        </main>
        <footer class="footer">
            <p>&copy; 2024 Nitesh Saw. All rights reserved.</p>
        </footer>
    </div>
    <script src="js/profile.js"></script>
</body>
</html>
