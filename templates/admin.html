<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Admin Dashboard</title>
    <link rel='stylesheet' href='/static/admin.css'>
</head>
<body>
    <div class='admin-container'>
        <header class='admin-header'>
            <h1>Admin Dashboard</h1>
            <a href='/logout' class='logout-btn'>Logout</a>
        </header>
        <main class='admin-main'>
            <div class='dashboard-cards'>
                <div class='stat-card'>
                    <h3>Total Users</h3>
                    <p class='stat-number'>1,234</p>
                </div>
                <div class='stat-card'>
                    <h3>Messages</h3>
                    <p class='stat-number'>56</p>
                </div>
                <div class='stat-card'>
                    <h3>Visits</h3>
                    <p class='stat-number'>8,901</p>
                </div>
                <div class='stat-card'>
                    <h3>Revenue</h3>
                    <p class='stat-number'>$12.5K</p>
                </div>
            </div>
            <div class='recent-activity'>
                <h2>Recent Activity</h2>
                <ul>
                    <li>New user registered - 2 min ago</li>
                    <li>Contact form submitted - 5 min ago</li>
                    <li>Admin login - 10 min ago</li>
                    <li>New order placed - 15 min ago</li>
                </ul>
            </div>
        </main>
    </div>
</body>
</html>
