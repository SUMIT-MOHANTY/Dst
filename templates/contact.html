<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
<title>Contact Us</title>
<link rel="stylesheet" href="/static/css/contact.css">
</head>
<body>
<div class="container">
<h1>Contact Us</h1>
<form id="contactForm" novalidate>
<div class="form-group">
<label for="name">Full Name</label>
<input type="text" id="name" name="name" autocomplete="name" required>
<div class="error-msg" id="error-name"></div>
</div>
<div class="form-group">
<label for="email">Email Address</label>
<input type="email" id="email" name="email" autocomplete="email" required>
<div class="error-msg" id="error-email"></div>
</div>
<div class="form-group">
<label for="message">Message</label>
<textarea id="message" name="message" rows="5" required></textarea>
<div class="error-msg" id="error-message"></div>
</div>
<div class="honeytrap" style="display:none;">
<label>Do not fill this out if you are human</label>
<input type="text" name="honeytrap_field">
</div>
<button type="submit" id="submitBtn">Send Message</button>
<p id="formFeedback"></p>
</form>
</div>
<script src="/static/js/contact.js"></script>
</body>
</html>
